:root{
  --sky1:#DFF3FF;--sky2:#BFE3F8;--ink:#12325B;--ink2:#46688F;--card:#FFFFFF;--line:#A9D2EC;
  --sand:#FFE3A0;--grass:#26A97F;--accent:#0B67D1;--on-accent:#FFFFFF;--sun:#FFC83D;--screen:#EAF3FF;
  --ok:#0E7C63;--okbg:#DDF6EE;--bad:#B8294B;--badbg:#FDE3EA;--lock:#8EA3BA;--road:#C9B27A;--roadline:#FFF3CC;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --sky1:#0B1E3A;--sky2:#0F2C52;--ink:#EAF4FF;--ink2:#9FBBDA;--card:#13294A;--line:#25456F;
    --sand:#7A6630;--grass:#38D1A0;--accent:#6FB5FF;--on-accent:#0B1E3A;--sun:#FFD566;--screen:#1B3560;
    --ok:#6EE7C4;--okbg:#14382F;--bad:#FF9DB3;--badbg:#45202C;--lock:#5D7391;--road:#6B5A2A;--roadline:#A58E4F}}
:root[data-theme="dark"]{color-scheme:dark;
  --sky1:#0B1E3A;--sky2:#0F2C52;--ink:#EAF4FF;--ink2:#9FBBDA;--card:#13294A;--line:#25456F;
  --sand:#7A6630;--grass:#38D1A0;--accent:#6FB5FF;--on-accent:#0B1E3A;--sun:#FFD566;--screen:#1B3560;
  --ok:#6EE7C4;--okbg:#14382F;--bad:#FF9DB3;--badbg:#45202C;--lock:#5D7391;--road:#6B5A2A;--roadline:#A58E4F}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:"Cairo",system-ui,"Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink);
  background:linear-gradient(var(--sky1),var(--sky2));background-attachment:fixed;line-height:1.7;font-size:17px;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:30}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:2px solid var(--line);display:flex;align-items:center;gap:8px;padding:8px 12px}
.brand{font-weight:900;font-size:18px;flex:1;text-align:center;white-space:nowrap}
.pill{border:2px solid var(--line);background:var(--sky1);color:var(--ink);border-radius:999px;padding:4px 12px;font:inherit;font-weight:800;min-height:40px;cursor:pointer;white-space:nowrap}
.pill[hidden]{display:none}
.xp{font-weight:800;font-size:14px;white-space:nowrap}
main{max-width:640px;margin:0 auto;padding:16px 14px 44px}
h1,h2,h3{line-height:1.35;margin:0 0 6px}h1{font-size:26px;font-weight:900}h2{font-size:21px;font-weight:800}h3{font-size:18px;font-weight:800}
p{margin:0 0 8px}.muted{color:var(--ink2)}.fine{color:var(--ink2);font-size:14px}
.bot{width:96px;height:96px;flex:none}
.say{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.bubble{background:var(--card);border:2px solid var(--ink);border-radius:20px 20px 20px 6px;padding:10px 16px;flex:1;font-weight:700}
.bubble p{color:var(--ink2);font-weight:600;font-size:16px}.bubble h1{font-size:23px}
.stack{display:grid;gap:12px}
.big{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:14px 16px;min-height:68px;cursor:pointer;text-align:start;
  box-shadow:0 4px 0 var(--ink);display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%}
.big b{font-size:20px;display:block;line-height:1.3}.big small{color:var(--ink2);font-size:14px;display:block}.big .e{font-size:34px}
.big:active,.opt:active,.go:active,.tool:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--grass);border-radius:999px}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.tool{font:inherit;font-weight:800;font-size:14px;line-height:1.3;color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:10px 4px;min-height:76px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.tool span{display:block;font-size:24px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:2px 12px;font-weight:800;font-size:14px}
/* journey */
.part{margin:22px 0 10px;background:var(--accent);color:var(--on-accent);border:2px solid var(--ink);border-radius:18px;padding:10px 16px;font-weight:900;font-size:19px;box-shadow:0 4px 0 var(--ink)}
.part small{display:block;font-weight:600;font-size:14px;opacity:.9}
.city{background:var(--card);border:2px solid var(--ink);border-radius:22px;padding:12px 12px 16px;margin:16px 0;box-shadow:0 4px 0 var(--ink)}
.cityhead{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.cityhead .em{width:54px;height:54px;border-radius:16px;background:var(--sand);border:2px solid var(--ink);display:grid;place-items:center;font-size:30px;flex:none}
.cityhead b{display:block;font-size:17px;line-height:1.35}.cityhead small{color:var(--ink2);font-size:13px}
.road{position:relative;display:grid;gap:10px;padding:8px 0 4px}
.road::before{content:"";position:absolute;top:18px;bottom:18px;left:50%;transform:translateX(-50%);width:10px;background:var(--road);border-radius:10px;opacity:.55}
.road::after{content:"";position:absolute;top:22px;bottom:22px;left:50%;transform:translateX(-50%);border-left:3px dashed var(--roadline)}
.stop{position:relative;z-index:1;width:76%;display:flex;align-items:center;gap:10px;background:var(--screen);border:2px solid var(--ink);border-radius:18px;padding:6px 10px;font:inherit;color:var(--ink);text-align:start;cursor:pointer;min-height:56px}

.stop .n{width:34px;height:34px;border-radius:50%;background:var(--sun);border:2px solid var(--ink);display:grid;place-items:center;font-weight:900;flex:none;color:#12325B}
.stop b{font-size:14.5px;line-height:1.35;flex:1}
.stop .st{font-size:13px;letter-spacing:1px;white-space:nowrap}
.stop.done{background:var(--okbg)}.stop.done .n{background:var(--grass);color:#fff}
.stop.here{outline:4px solid var(--sun);outline-offset:2px}
.here-tag{position:absolute;top:-14px;inset-inline-end:10px;background:var(--sun);color:#12325B;border:2px solid var(--ink);border-radius:999px;font-size:12px;font-weight:900;padding:0 8px}
.chest{margin-top:10px;width:100%;display:flex;align-items:center;gap:10px;background:var(--sand);color:#12325B;border:2px solid var(--ink);border-radius:18px;padding:8px 12px;font:inherit;font-weight:800;cursor:pointer;text-align:start;min-height:56px}
.chest .em{font-size:30px}.chest small{display:block;font-weight:600;font-size:13px}
.chest.locked,.castle.locked{background:var(--card);color:var(--lock);border-color:var(--lock);filter:grayscale(.8)}
.castle{width:100%;display:flex;align-items:center;gap:12px;background:var(--sun);color:#12325B;border:3px solid var(--ink);border-radius:22px;padding:12px 14px;font:inherit;font-weight:900;font-size:18px;cursor:pointer;text-align:start;box-shadow:0 4px 0 var(--ink);margin:10px 0 6px}
.castle .em{font-size:38px}.castle small{display:block;font-weight:600;font-size:13px}
/* quiz */
.prog{height:12px;background:var(--line);border-radius:999px;overflow:hidden;margin-bottom:12px}.prog i{display:block;height:100%;background:var(--grass);border-radius:999px;transition:width .3s}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.passage{background:var(--screen);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:18px;line-height:1.9;overflow-x:auto}.plabel{color:var(--accent);font-weight:800;font-size:15px;margin:0 0 2px}
.q{font-size:21px;font-weight:800;unicode-bidi:plaintext;text-align:center;padding:6px 2px}
.opts{display:grid;gap:12px}
.opt{font:inherit;font-weight:800;font-size:20px;color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:12px 10px;min-height:56px;cursor:pointer;text-align:center;box-shadow:0 4px 0 var(--ink);unicode-bidi:plaintext;width:100%}
.opt.good{background:var(--okbg);border-color:var(--ok);color:var(--ok);box-shadow:0 4px 0 var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad);box-shadow:0 4px 0 var(--bad)}
.opt.gone{opacity:.35;text-decoration:line-through}.opt:disabled{cursor:default}
.feedback{border-radius:14px;padding:12px 14px;margin:12px 0;font-weight:700}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.no{background:var(--badbg);color:var(--bad)}
.go{font:inherit;font-weight:900;font-size:20px;background:var(--accent);color:var(--on-accent);border:2px solid var(--ink);border-radius:16px;padding:12px 18px;min-height:56px;cursor:pointer;width:100%;box-shadow:0 4px 0 var(--ink);margin-top:8px}
.go.alt{background:var(--card);color:var(--ink)}
.learn{background:var(--screen);border:2px solid var(--accent);border-radius:16px;padding:12px 16px;margin:12px 0}.learn b{display:block;color:var(--accent);margin-bottom:2px}.learn p{font-weight:600;font-size:17px;margin:0}
.big-score{font-size:46px;font-weight:900;text-align:center;line-height:1.3}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);margin-bottom:10px;background:var(--card)}
.row b{display:block;line-height:1.3}.row small{color:var(--ink2)}
.parent{background:var(--card);border:2px dashed var(--accent);border-radius:18px;padding:12px 16px;margin:16px 0}.parent b{color:var(--accent);display:block;margin-bottom:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 16px}
.stats div{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 4px;text-align:center;font-size:14px;font-weight:700}
.stats b{display:block;font-size:26px;font-weight:900;color:var(--accent);line-height:1.2}
.note{background:var(--badbg);color:var(--bad);border-radius:14px;padding:10px 14px;font-weight:700;margin-bottom:12px}
.inst-head{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.appicon{width:88px;height:88px;border-radius:20px;flex:none;box-shadow:0 4px 0 var(--ink);border:2px solid var(--ink)}
.steps{counter-reset:s;list-style:none;padding:0;margin:8px 0}.steps li{counter-increment:s;position:relative;padding:8px 52px 8px 0;margin-bottom:6px;min-height:40px;font-weight:600}
.steps li::before{content:counter(s);position:absolute;right:0;top:6px;width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:900}
.card h2{margin-bottom:8px}.card ul{margin:6px 0;padding:0 20px 0 0}.card li{margin-bottom:6px}
.linkbtn{font:inherit;background:none;border:0;color:var(--accent);font-weight:800;text-decoration:underline;cursor:pointer;padding:10px;min-height:44px}
footer{text-align:center;color:var(--ink2);font-size:14px;margin-top:24px}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
#fx span{position:absolute;top:-30px;font-size:28px;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.9}}
button:focus-visible{outline:4px solid var(--sun);outline-offset:2px}

/* رحلة: مشهد ومسار */
.scene{position:relative;height:150px;border-radius:22px;border:2px solid var(--ink);overflow:hidden;margin:0 0 12px;background:linear-gradient(var(--t1,#BFE3F8),var(--t2,#DFF3FF));box-shadow:0 4px 0 var(--ink)}
.scene.small{height:110px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .scene{filter:brightness(.62) saturate(1.1)}}
:root[data-theme="dark"] .scene{filter:brightness(.62) saturate(1.1)}
.scene .sun{position:absolute;top:8px;inset-inline-start:56%;font-size:34px}
.scene .cloud{position:absolute;font-size:34px;opacity:.95;animation:drift 14s ease-in-out infinite alternate}
.scene .c1{top:12px;inset-inline-start:18%}.scene .c2{top:44px;inset-inline-start:52%;font-size:26px;animation-duration:18s}
.scene .hills{position:absolute;bottom:0;left:0;width:100%;height:60%}
.scene .land{position:absolute;bottom:14px;inset-inline-end:9%;font-size:40px}.scene .home{position:absolute;bottom:16px;inset-inline-start:4%;font-size:28px}
.scene .flag{position:absolute;bottom:20px;inset-inline-end:1%;font-size:30px}
.scene .balloon{position:absolute;top:30px;font-size:42px;animation:bob 3s ease-in-out infinite;transition:inset-inline-start .6s}
@keyframes drift{to{transform:translateX(-34px)}}@keyframes bob{50%{transform:translateY(-10px)}}
.trip{display:flex;align-items:center;gap:8px;margin:0 0 4px;font-size:22px}
.tbar{position:relative;flex:1;height:12px;background:var(--line);border-radius:999px}.tbar i{display:block;height:100%;background:var(--grass);border-radius:999px}
.tbar .car{position:absolute;top:-17px;font-size:26px;transition:inset-inline-start .6s}
.sw{position:relative;display:flex;min-height:60px;align-items:center}
.sw.s{justify-content:flex-start}.sw.e{justify-content:flex-end}
.sw .deco{position:absolute;top:50%;transform:translateY(-50%);font-size:32px}
.sw.s .deco{inset-inline-end:6%}.sw.e .deco{inset-inline-start:6%}
.road .stop{justify-self:auto!important}
.city{border-color:var(--ink)}.city .cityhead .em{background:var(--cc,var(--sand))}
.infobar{width:100%;display:flex;align-items:center;gap:10px;background:var(--sun);color:#12325B;border:2px solid var(--ink);border-radius:16px;padding:10px 14px;font:inherit;font-weight:800;cursor:pointer;text-align:start;box-shadow:0 3px 0 var(--ink);margin:0 0 12px;min-height:56px}
.infobar small{display:block;font-weight:600;font-size:13px}
.postcard{background:linear-gradient(135deg,var(--sand),var(--card));border:3px dashed var(--ink);border-radius:18px;padding:14px 16px;margin:12px 0;position:relative}
.postcard .pc-stamp{position:absolute;top:10px;inset-inline-end:12px;width:54px;height:62px;border:3px double var(--ink);border-radius:6px;display:grid;place-items:center;font-size:30px;background:var(--card);transform:rotate(6deg)}
.postcard b{display:block;font-size:19px;margin-bottom:4px;padding-inline-end:70px}.postcard p{margin:0;font-weight:600;padding-inline-end:70px}
.pass{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 14px}
.stamp{border:3px double var(--ink);border-radius:50%;aspect-ratio:1;display:grid;place-items:center;text-align:center;padding:6px;font-size:12px;font-weight:800;line-height:1.25;background:var(--card);transform:rotate(-6deg)}
.stamp span{display:block;font-size:28px}.stamp.off{filter:grayscale(1);opacity:.4;border-style:dashed}

/* لمسة احترافية: أخفّ وأهدأ */
.infostrip{width:100%;display:flex;align-items:center;gap:8px;background:transparent;color:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:0 12px;min-height:36px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;margin:0 0 12px;text-align:start}
.infostrip span:nth-child(2){flex:1}.infostrip:hover{background:var(--card)}
.top{padding:6px 12px;border-bottom:1px solid var(--line)}.brand{font-size:17px;letter-spacing:.2px}
.pill{min-height:36px;font-size:14px;padding:2px 12px;border-width:1px}
#info{padding:2px 10px;min-height:32px;font-size:14px;opacity:.85}
.big,.opt,.go,.tool,.castle,.part,.city{box-shadow:0 2px 0 var(--ink)}
.big,.city,.card,.row,.castle,.part,.chest{border-radius:14px}
.big:active,.opt:active,.go:active,.tool:active{box-shadow:0 0 0 var(--ink);transform:translateY(2px)}
.big,.opt,.tool,.go,.stop,.chest,.castle,.part,.city,.scene{border-width:1.5px}
h1{font-size:23px}h2{font-size:19px}.big b{font-size:18px}
.bubble{border-width:1.5px;font-size:16px}.bubble h1{font-size:21px}
.scene{box-shadow:0 2px 0 var(--ink);border-radius:16px}
.chip{font-size:13px;border-width:1px}
main{padding-top:12px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}#fx{display:none}}
@media print{.top,.go,.tools,#back{display:none!important}body{background:#fff}main{padding:0}}

/* الإصدار التفاعلي الموسّع */
.skill-grid{display:grid;gap:10px;margin:12px 0}.skill-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}.skill-card b{display:flex;justify-content:space-between;gap:8px}.skill-card small{color:var(--ink2)}.skill-card .bar{margin-top:7px}.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick-grid .go{font-size:16px;margin-top:0}.achievement{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}.achievement .badge{font-size:28px}.achievement.locked{opacity:.5;filter:grayscale(.8)}.setting-row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}.setting-row .pill{min-width:48px}.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .15em;font-size:.92em}.frac>span:first-child{border-bottom:2px solid currentColor;padding:0 .2em .05em}.frac>span:last-child{padding:.05em .2em 0}.nums sup{font-size:.7em}.expr{white-space:nowrap}.q .nums,.q .expr{max-width:100%}.extra{margin-top:18px}.extra h2{font-size:1rem;margin:0 0 8px;color:var(--muted,#64748b)}a.big{text-decoration:none;color:inherit}.extra-app{border-style:dashed}.setting-row>span:first-child{display:flex;flex-direction:column;gap:2px}.setting-row>span:first-child small{color:var(--muted,#64748b);font-size:.85em}.setting-row>span:last-child{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}.review-due{border-color:var(--sun);background:var(--sand)}
:root[data-font="large"]{font-size:19px}:root[data-font="xl"]{font-size:21px}
@media(max-width:420px){.quick-grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}

.mathrtl{direction:rtl;unicode-bidi:isolate;display:inline;white-space:normal}.q-instruction{direction:rtl;unicode-bidi:isolate}
/* ======================== طبقة التصميم المحسّنة ======================== */
:root{--brand:#0B67D1;--brand-deep:#084B9B;--brand-soft:#EAF4FF;--focus:#F59E0B;--success:#138A5B;--danger:#B42318;--ink:#12325B;--ink2:#52657D;--card:#FFFFFF;--line:#C9D8E8;--surface:#F5FAFF}

main{max-width:760px;padding:18px 16px 44px}

p{max-width:68ch}.muted,.fine{color:var(--ink2);line-height:1.8}

.brand{font-weight:900;color:var(--brand-deep)}
.card,.big,.city,.castle,.part,.chest,.row,.skill-card,.achievement,.setting-row{border-color:var(--line);box-shadow:0 5px 14px rgba(31,82,126,.08)}
.card{background:rgba(255,255,255,.94);padding:18px}
.say{margin:8px 0 16px}.bubble{background:rgba(255,255,255,.96);border-color:#AFC8E0;box-shadow:0 5px 14px rgba(31,82,126,.08)}
.scene{border:1px solid #AFC8E0;box-shadow:0 7px 18px rgba(31,82,126,.1);height:142px}
.chips{gap:8px;margin:12px 0 18px}.chip{background:#fff;border-color:#BFD2E5;color:var(--ink);padding:6px 11px;font-weight:750}
.stack{gap:12px}.big{min-height:76px;background:#fff;border:1px solid #B7CDE2;padding:15px 16px}.big:hover,.tool:hover,.webar-card:hover{border-color:var(--brand);transform:translateY(-1px)}
.big b{font-size:19px}.big small{display:block;color:var(--ink2);font-size:13px;line-height:1.55;margin-top:3px}
.big .e{font-size:30px}.bar{height:9px;background:#E6EFF7;margin-top:9px}.bar i{background:linear-gradient(90deg,var(--brand),#36A1E8)}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.tool{min-height:72px;background:rgba(255,255,255,.82);border:1px solid #C3D6E7;border-radius:15px;padding:10px 8px;color:var(--ink);font-weight:800;box-shadow:0 3px 9px rgba(31,82,126,.07)}.tool span{display:block;font-size:24px;margin-bottom:2px}
.go{min-height:50px;border-radius:14px;border:1px solid var(--brand-deep);background:linear-gradient(135deg,var(--brand),#1688D9);box-shadow:0 4px 0 var(--brand-deep);font-size:17px;font-weight:850}.go.alt{background:#fff;color:var(--brand-deep);border-color:#9DB9D3;box-shadow:0 3px 0 #B5C7D8}
.quiz-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--brand-soft);border:1px solid #BBD5EC;border-radius:12px;padding:9px 12px;margin:10px 0 12px;color:var(--brand-deep);font-size:14px;font-weight:800}.quiz-meta .skill{color:var(--ink2);font-weight:700}
.q{font-size:clamp(19px,4.8vw,25px);font-weight:850;line-height:1.75;text-align:center}.mathrtl{font-variant-numeric:tabular-nums;font-size:1.08em;font-weight:900;letter-spacing:.02em}
.opts{display:grid;gap:10px;margin:14px 0}.opt{position:relative;display:flex;align-items:center;gap:12px;text-align:start;min-height:58px;padding:12px 14px 12px 16px;background:#fff;border:1px solid #B8CCDF;border-radius:14px;color:var(--ink);font:inherit;font-size:17px;font-weight:750;line-height:1.55;box-shadow:0 3px 9px rgba(31,82,126,.06)}.opt:hover{border-color:var(--brand);background:#F7FBFF}.opt:disabled{opacity:.5}.option-letter{flex:0 0 32px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#EAF4FF;color:var(--brand-deep);font-weight:900}.opt.good .option-letter{background:#D7F4E7;color:var(--success)}.opt.bad .option-letter{background:#FCE1DF;color:var(--danger)}
.feedback{border-radius:14px;padding:13px 15px;font-size:17px;font-weight:850}.feedback.ok{background:#E6F7EF;color:#0B6E48;border:1px solid #98D9BA}.feedback.no{background:#FFF0EE;color:#9C2D22;border:1px solid #F0B4AC}
.learn{border-inline-start:5px solid var(--focus);background:#FFF9E9;border-radius:12px;padding:12px 15px;margin:12px 0}.learn p{margin:4px 0;color:#604B17}
:focus-visible{outline:4px solid rgba(245,158,11,.7);outline-offset:3px}.linkbtn{text-decoration:underline;text-underline-offset:3px}
.webar-menu{grid-template-columns:repeat(3,1fr)}.webar-card{min-height:128px;display:flex;flex-direction:column;justify-content:center;text-align:center;background:#0C2342;color:#fff;border-color:#315A86}.webar-card small{color:#D7E7F7}.webar-card .em{font-size:34px}.webar-stage{box-shadow:0 10px 24px rgba(7,21,43,.22)}

@media(max-width:560px){main{padding-inline:12px}.tools{grid-template-columns:repeat(2,1fr)}.webar-menu{grid-template-columns:1fr}.webar-card{min-height:78px;flex-direction:row;text-align:start;justify-content:flex-start}.opt{min-height:62px}.q{line-height:1.85}}
@media(max-width:360px){.tools{gap:7px}.tool{font-size:13px;padding-inline:5px}.chip{font-size:12px;padding-inline:8px}}
@media(prefers-reduced-motion:reduce){.big:hover,.tool:hover,.webar-card:hover{transform:none}}

.offline-note{background:#FFF9E9;color:#604B17;border:1px solid #E7C56B;border-radius:12px;padding:9px 12px;margin:0 0 12px;font-weight:750;text-align:center}.update-note{position:fixed;inset:auto 12px 12px;z-index:20;background:#12325B;color:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 8px 24px rgba(18,50,91,.25);font-weight:750;text-align:center}.update-note button{margin-inline-start:8px;border:0;border-radius:8px;padding:5px 9px;font:inherit;font-weight:850;color:#12325B;background:#fff}

/* ===== حالات الإجابة: واضحة وقوية، لا تعتمد على اللون وحده ===== */
.opt:disabled{opacity:1;cursor:default}
.opt:disabled:not(.good):not(.wrong){opacity:.55}
.opt.gone:disabled:not(.good){opacity:.35}
.opt:disabled:not(.good):not(.wrong):hover{background:var(--opt-bg,#fff);border-color:var(--opt-line,#B8CCDF)}
.opt.good,.opt.good:hover,.opt.good:disabled{background:#138A5B;border-color:#0E6E48;color:#fff;box-shadow:0 3px 0 #0B5A3A;opacity:1}
.opt.wrong,.opt.wrong:hover,.opt.wrong:disabled{background:#B42318;border-color:#8E1B12;color:#fff;box-shadow:0 3px 0 #7A160F;opacity:1}
.opt.good .option-letter{background:#fff;color:#138A5B}
.opt.wrong .option-letter{background:#fff;color:#B42318}
.opt.good::after,.opt.wrong::after{margin-inline-start:auto;font-size:1.35em;font-weight:900;line-height:1;padding-inline-start:8px}
.opt.good::after{content:"✓"}
.opt.wrong::after{content:"✗"}
.opt.good .frac>span:first-child,.opt.wrong .frac>span:first-child{border-color:#fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}


/* ===== العناصر المقفلة: تبدو مقفلة لكن نصّها مقروء ===== */
.stamp.off{opacity:1;filter:none;border-style:dashed;color:var(--ink2)}
.stamp.off span{filter:grayscale(1);opacity:.45}
.achievement.locked{opacity:1;filter:none;border-style:dashed}
.achievement.locked .badge{filter:grayscale(1);opacity:.45}
.achievement.locked b,.achievement.locked small{color:var(--ink2)}
.chest.locked,.castle.locked{filter:none;color:var(--ink2);border-style:dashed}
.chest.locked .em,.castle.locked .em{filter:grayscale(1);opacity:.6}
/* ===== الوضع الداكن: ألوان كاملة للمكوّنات ===== */

/* ===== الشاشة الرئيسية (تصميم 2026-11) ===== */
.hm-hero{position:relative;overflow:hidden;border-radius:26px;padding:18px 18px 14px;color:#fff;background:radial-gradient(120% 90% at 100% 0%,#3FA9FF 0%,rgba(63,169,255,0) 55%),linear-gradient(135deg,#0B67D1 0%,#0E4FA8 45%,#14A39A 100%);box-shadow:0 10px 26px rgba(11,103,209,.28);margin:4px 0 18px}
.hm-hero::after{content:"";position:absolute;inset-inline-end:-40px;bottom:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}
.hm-hero-top{display:flex;align-items:center;gap:8px;position:relative;z-index:1}
.hm-hero-txt{flex:1}
.hm-kicker{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:2px 12px;font-size:13px;font-weight:800;margin-bottom:6px}
.hm-hero h1{font-size:32px;line-height:1.25;margin:0 0 4px;font-weight:900;color:#fff}
.hm-hero p{margin:0;font-size:16px;font-weight:700;color:rgba(255,255,255,.92);line-height:1.6}
.hm-bot .bot{width:96px;height:96px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
.hm-bot{background:rgba(255,255,255,.95);border-radius:24px;padding:4px;flex:none;animation:hmfloat 3.5s ease-in-out infinite}
@keyframes hmfloat{50%{transform:translateY(-5px)}}
.hm-path{display:flex;align-items:center;gap:8px;margin:14px 0 12px;position:relative;z-index:1;font-size:22px}
.hm-path i{flex:1;height:10px;border-radius:999px;background:rgba(255,255,255,.25);position:relative;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.45) 0 8px,transparent 8px 16px)}
.hm-path i b{position:absolute;inset-block:0;inset-inline-start:0;border-radius:999px;background:#FFD566}
.hm-path em{position:absolute;top:-22px;font-style:normal;font-size:24px;transform:scaleX(-1)}
.hm-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;z-index:1}
.hm-stats div{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:16px;padding:8px 6px;text-align:center}
.hm-stats b{display:block;font-size:22px;font-weight:900;line-height:1.2;color:#fff}
.hm-stats small{font-size:12px;font-weight:700;color:rgba(255,255,255,.88)}
.hm-h{font-size:17px;font-weight:900;margin:6px 2px 10px;color:var(--ink)}
.hm-grades{display:grid;gap:12px;margin-bottom:18px}
.hm-grade{--g1:#FF9F43;--g2:#FF6B6B;font:inherit;color:var(--ink);text-align:start;cursor:pointer;display:flex;align-items:center;gap:14px;width:100%;padding:14px;border-radius:22px;border:1px solid var(--line);background:var(--card);box-shadow:0 6px 16px rgba(31,82,126,.10);position:relative;overflow:hidden;transition:transform .15s}
.hm-grade.g6{--g1:#7C5CFF;--g2:#3E8BFF}
.hm-grade::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:6px;background:linear-gradient(var(--g1),var(--g2))}
.hm-grade:hover{transform:translateY(-2px)}.hm-grade:active{transform:translateY(1px)}
.hm-num{flex:none;width:62px;height:62px;border-radius:20px;display:grid;place-items:center;font-size:36px;font-weight:900;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 6px 14px rgba(0,0,0,.15)}
.hm-gbody{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.hm-gbody b{font-size:20px;font-weight:900}
.hm-subj{display:flex;flex-wrap:wrap;gap:6px}
.hm-subj span{font-size:13px;font-weight:800;padding:2px 10px;border-radius:999px;background:color-mix(in srgb,var(--g1) 14%,transparent);color:var(--ink)}
.hm-gbody small{font-size:13px;color:var(--ink2);font-weight:700}
.hm-gbar{display:block;height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.hm-gbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--g1,#14A39A),var(--g2,#0B67D1))}
.hm-go{font-size:30px;font-weight:900;color:var(--g1);flex:none}
.hm-tools{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.hm-tools button{font:inherit;font-weight:800;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 4px 10px;min-height:84px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 4px 12px rgba(31,82,126,.07);line-height:1.3}
.hm-tools button span{font-size:26px}
.hm-tools em{font-style:normal;background:#FF6B6B;color:#fff;border-radius:999px;padding:0 7px;font-size:12px}
.hm-level{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:14px;font-weight:800}
.hm-level small{color:var(--ink2);font-weight:700;font-size:13px}
footer .linkbtn{font-size:13px}
@media (prefers-reduced-motion: reduce){.hm-bot{animation:none}}

.hm-continue,.hm-mock{font:inherit;color:var(--ink);text-align:start;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);box-shadow:0 6px 16px rgba(31,82,126,.10);margin-bottom:14px}
.hm-continue>span:first-child,.hm-mock>span:first-child{font-size:28px;flex:none}
.hm-continue>span:nth-child(2),.hm-mock>span:nth-child(2){flex:1;display:flex;flex-direction:column;gap:2px}
.hm-continue b,.hm-mock b{font-size:17px}.hm-continue small,.hm-mock small{color:var(--ink2);font-size:13px;font-weight:700}
.hm-continue{border:2px solid #14A39A}.hm-continue .hm-go{color:#14A39A}
.hm-mock{background:linear-gradient(135deg,#FFF6E0,#FFE6EC);border-color:#FFC27A}.hm-mock .hm-go{color:#FF7A45}
:root[data-theme="dark"] .hm-mock{background:linear-gradient(135deg,#3A2E14,#3A1F2A)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hm-mock{background:linear-gradient(135deg,#3A2E14,#3A1F2A)}}
.seg{display:flex;gap:8px;margin:12px 0}.seg button{flex:1;font:inherit;font-weight:800;padding:10px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}.seg button.on{background:#0B67D1;color:#fff;border-color:#0B67D1}
.mock-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 4px 12px rgba(31,82,126,.07)}.mock-card>b{font-size:18px;display:block;margin-bottom:8px}
.mock-btns{display:grid;gap:8px}.mock-btns .go{font-size:15px;margin:0;min-height:48px}
.exam-bar{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 12px;margin-top:10px}
#timer{font-weight:900;font-size:18px;font-variant-numeric:tabular-nums}#timer.low{color:#E5484D}
.opt.picked{outline:3px solid #0B67D1;outline-offset:-3px}
.exam-rev summary{cursor:pointer;font-weight:700;line-height:1.7}.exam-rev p{margin:6px 0}

.fam-lead{font-size:18px;line-height:1.8}.fam h3{margin:12px 0 4px;font-size:16px}.fam ul,.card ul{margin:4px 0;padding-inline-start:20px;line-height:1.9}.fam small{color:var(--ink2)}

/* ===== توحيد الشاشات الداخلية مع تصميم الرئيسية ===== */
.hm-grade.s-ma{--g1:#FF9F43;--g2:#FF6B6B}.hm-grade.s-ar{--g1:#14A39A;--g2:#0B67D1}.hm-grade.s-sc{--g1:#7C5CFF;--g2:#3E8BFF}
.go{border-radius:18px;border:0;background:linear-gradient(135deg,#0B67D1,#1688D9);color:#fff;box-shadow:0 6px 14px rgba(11,103,209,.25)}
.go.alt{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 4px 12px rgba(31,82,126,.08)}
.go:active,.go.alt:active{transform:translateY(1px);box-shadow:0 2px 6px rgba(31,82,126,.15)}
.card,.row,.achievement,.mock-card{border-radius:20px;border:1px solid var(--line);box-shadow:0 4px 12px rgba(31,82,126,.07)}
.city{border-radius:22px;border:1px solid var(--line);box-shadow:0 6px 16px rgba(31,82,126,.10)}
.part{border:0;border-radius:20px;color:#fff;background:linear-gradient(135deg,#0B67D1 0%,#0E4FA8 50%,#14A39A 100%);box-shadow:0 8px 20px rgba(11,103,209,.25)}
.castle{border:0;border-radius:20px;background:linear-gradient(135deg,#FFD566,#FFB347);color:#3A2600;box-shadow:0 6px 16px rgba(255,159,67,.30)}
.castle.locked{background:var(--card);color:var(--ink2);border:1px dashed var(--line);box-shadow:none}
.chest{border-radius:16px;border:1px solid var(--line);box-shadow:0 3px 10px rgba(31,82,126,.08)}
.opt{border-radius:16px;box-shadow:0 3px 10px rgba(31,82,126,.07)}
.opt:active{transform:translateY(1px)}
.bubble{border-radius:22px 22px 22px 8px;box-shadow:0 6px 16px rgba(31,82,126,.08)}
.prog{border-radius:999px;overflow:hidden}.prog i{background:linear-gradient(90deg,#14A39A,#0B67D1)}
.passage{border-radius:18px;border:1px solid var(--line)}
</style>

function normalizeProgress(raw){
  const src=raw&&typeof raw==="object"&&!Array.isArray(raw)?raw:{};
  const map=k=>src[k]&&typeof src[k]==="object"&&!Array.isArray(src[k])?src[k]:{};
  const num=(v,f=0)=>Number.isFinite(Number(v))&&Number(v)>=0?Number(v):f;
  const stats=map("stats"),streak=map("streak"),daily=map("daily"),settings=map("settings");
  return {stars:map("stars"),chest:map("chest"),castle:map("castle"),mist:map("mist"),
    xp:num(src.xp),stats:{a:num(stats.a),o:num(stats.o)},
    streak:{d:typeof streak.d==="string"?streak.d:"",n:num(streak.n)},
    qstats:map("qstats"),review:map("review"),daily:{d:typeof daily.d==="string"?daily.d:"",done:num(daily.done)},ach:map("ach"),grade:[3,6].includes(src.grade)?src.grade:0,last:typeof src.last==="string"?src.last:"",exams:Array.isArray(src.exams)?src.exams.filter(x=>x&&typeof x==="object").slice(-30):[],
    settings:{theme:["auto","light","dark"].includes(settings.theme)?settings.theme:"auto",font:["normal","large","xl"].includes(settings.font)?settings.font:"normal",digits:settings.digits==="en"?"en":"ar"}};
}

/* تسطيح الكتب */
const BOOKS=[],LES={},CHP={},PRT={};
DATA.forEach(gr=>gr.subjects.forEach(sb=>{
  const bk={g:gr.g,id:gr.g+"-"+sb.id,sid:sb.id,n:sb.n,e:sb.e,book:sb.book,parts:sb.parts};BOOKS.push(bk);
  sb.parts.forEach(pt=>{PRT[pt.id]={pt,bk};pt.chapters.forEach(c=>{CHP[c.id]={c,pt,bk};c.lessons.forEach(ls=>{LES[ls.id]={ls,c,pt,bk}})})});
}));
function validateQuestionBank(){
  const seen=new Set();let total=0;
  BOOKS.forEach(book=>book.parts.forEach(part=>part.chapters.forEach(ch=>ch.lessons.forEach(lesson=>lesson.q.forEach(q=>{
    total++;
    if(!q.id||seen.has(q.id))throw new Error("معرّف سؤال مفقود أو مكرر: "+q.id);
    seen.add(q.id);
    if(!q.prompt||!Array.isArray(q.options)||q.options.length<2)throw new Error("بيانات سؤال غير صالحة: "+q.id);
    const ids=q.options.map(o=>o.id);
    if(ids.some(id=>!id)||new Set(ids).size!==ids.length||!ids.includes(q.correctOptionId))throw new Error("خيارات أو إجابة صحيحة غير صالحة: "+q.id);
    if(q.options.some(o=>typeof o.text!=="string"))throw new Error("خيار بلا نص: "+q.id);
  })))));
  return total;
}
const QUESTION_BANK_TOTAL=validateQuestionBank();
const lessonsOf=o=>o.chapters?o.chapters.flatMap(c=>c.lessons):o.parts?o.parts.flatMap(lessonsOf):o.lessons||[];

    if(op==="÷")return `${E(`${f(a)} ÷ ${f(b)} = ${f(r)}`)}، لأن ${E(`${f(r)} × ${f(b)} = ${f(a)}`)}.`;

  return `${how?how+". ":""}فتكون الجملة كاملة: ${full}.`;
}

function ans(k){

    t.o.forEach((o,j)=>{const b=$("#o"+j);b.disabled=true;if(j===k)b.classList.add("picked")});setTimeout(()=>{if(Q.mode==="exam"&&Q.list[Q.i]===t){Q.i++;step()}},350);return}

function progress(){

  const weak=Object.entries(P.qstats).filter(([,x])=>x.a&&x.o/x.a<.7).length;
  show(`<div class="muted" style="font-weight:700;margin-bottom:6px">${GN[g]}</div><h1>تقرير تقدّمي ذكي</h1>
  <div class="stats"><div><b>${P.xp}</b>نقطة</div><div><b>${st_.a?Math.round(st_.o/st_.a*100):0}%</b>الدقة</div><div><b>${mistN()}</b>دفتر الأخطاء</div><div><b>${due}</b>مراجعة اليوم</div></div>
  <div class="chips"><span class="chip">🏅 ${LEVELS[lv][1]}</span><span class="chip">${streakTxt()}</span><span class="chip">⭐ ${got}/${tot}</span><span class="chip">📌 ${cnt(weak,"مهارة")} تحتاج دعمًا</span></div>
  <div class="card"><h2>🎯 توصية اليوم</h2><p>${due?`لديك ${cnt(due,"سؤال")} حان وقت مراجعتها من دفتر الأخطاء.`:weak?"الأسئلة الخاطئة تعود تلقائيًا في المهمة الذكية للتدرّب عليها.":"كلما زادت الإجابات صارت التوصية أدق."}</p><button class="go" onclick="go(daily)">بدء المهمة الذكية</button></div>
  <h2>التقدم حسب الكتاب</h2>${bs.map(b=>{const ls=lessonsOf(b),ss=ls.reduce((a,l)=>a+stars(l.id),0),d=ls.filter(l=>stars(l.id)>0).length;return `<div class="row"><span><b>${b.e} ${b.n}</b><small>${d} من ${cnt(ls.length,"درس")} · ${ss}/${ls.length*3} ⭐</small></span></div>`}).join("")}
  <h2 style="margin-top:14px">🏆 الإنجازات</h2>${badges}
  <button class="go" onclick="go(family)">👨‍👩‍👧 ملخّص للأسرة ورمز للمعلمة</button><button class="go alt" onclick="go(skillMap)">🧭 خريطة المهارات</button><button class="go alt" onclick="window.print()">🖨️ طباعة التقرير</button><button class="go alt" onclick="back()">رجوع</button>`);
}

  <div class="card"><h2>🎯 هدف التطبيق</h2><p>رحلة تدريب ممتعة للطلاب والطالبات مع أسرهم، تمرّ بدروس كتب الوزارة درسًا درسًا، وتتدرّب على مهارات الاختبارات الوطنية «نافس» مع تلميحات وشرح عند الخطأ ومتابعة للتقدّم.</p></div>

  <div class="card"><h2>🗺️ كيف تعمل الرحلة؟</h2><ul><li><b>المحطات:</b> كل درس محطة فيها 6 أسئلة تتغير في كل مرة، ونجوم حسب نتيجتك.</li><li><b>صندوق الفصل 🎁:</b> تحدٍّ شامل من دروس الفصل.</li><li><b>القلعة 🏰:</b> اختبار تجريبي بلا تلميحات في نهاية كل جزء.</li><li><b>مهمة اليوم 🎯</b> و<b>دفتر الأخطاء 📒</b> و<b>تقدّمي 📈</b> للمتابعة.</li></ul>

  <div class="card"><h2>🔒 الخصوصية</h2><ul><li>لا يطلب التطبيق اسمًا ولا بريدًا ولا أي حساب.</li><li>لا يجمع بيانات شخصية، ولا يستخدم أدوات تتبّع أو تحليلات، ولا يعرض إعلانات، ولا توجد مشتريات داخله.</li><li>يُحفظ تقدّم الطفل (النجوم والنقاط والنتائج ودفتر الأخطاء) على هذا الجهاز فقط، ولا يُرسل إلى أي جهة.</li><li>لا يتصل التطبيق بأي موقع آخر، ويعمل بدون إنترنت بعد أول تشغيل. أما زر «الإبلاغ عن مشكلة» فيفتح تطبيق البريد برسالة جاهزة إلى المطوّر، ولا يُرسَل شيء إلا إذا ضغطتم «إرسال» بأنفسكم.</li><li>يمكنكم مسح كل ما حُفظ في أي وقت بالزر أدناه.</li></ul>
  <p class="fine">قد يسجّل مزوّد استضافة الصفحة زيارات تقنية عامة كأي موقع إلكتروني، وليس للتطبيق وصول إليها. يعمل التطبيق دون إنترنت بعد أول تشغيل.${APP.privacyPage?` <a href="privacy.html">صفحة الخصوصية الكاملة</a>`:""}</p></div>
  <div class="card"><h2>⚠️ إخلاء المسؤولية</h2><ul><li>تطبيق تعليمي مجتمعي مستقل، وليس تابعًا لهيئة تقويم التعليم والتدريب ولا لوزارة التعليم، ولا معتمدًا منهما.</li><li>اسم «نافس» يُستخدم لوصف نوع الاختبارات فقط.</li><li>جميع الأسئلة من إعداد مطوّر التطبيق على نمط المهارات المعلنة، وهي ليست أسئلة رسمية ولا تتنبأ بأسئلة الاختبار الفعلي.</li><li>النجوم والنقاط للتدريب فقط، وليست تقييمًا رسميًا لمستوى الطالب.</li><li>بذلنا جهدنا للدقة، لكن قد توجد أخطاء أو صياغات تحتاج إلى تحسين. نوصي بمراجعة المعلمة للمحتوى، ويمكن الإبلاغ عن السؤال من زر «الإبلاغ عن مشكلة» أثناء التدريب، فيُفتح البريد برسالة جاهزة فيها بيانات السؤال.</li></ul></div>
  <div class="card"><h2>👨‍👩‍👧 لأولياء الأمور</h2><p>اجلسوا مع طفلكم، واطلبوا منه أن يشرح لكم إجاباته ويراجع دفتر الأخطاء، وخصّصوا وقتًا قصيرًا للتدريب كل يوم. تقرير «تقدّمي» يمكن طباعته أو حفظه.</p></div>
  <div class="card"><h2>ℹ️ المطوّر والاعتمادات</h2><ul><li><b>فكرة وتطوير:</b> ${APP.dev}</li>${APP.contact?`<li><b>للتواصل:</b> <a href="mailto:${APP.contact}" dir="ltr">${APP.contact}</a></li>`:""}<li>© ${APP.year} جميع الحقوق محفوظة للمطوّر.</li><li>الخطان: Cairo وNoto Naskh Arabic (للنصوص المشكولة)، مرخّصان بموجب رخصة SIL Open Font License 1.1.</li></ul></div>
  <button class="go alt" id="rst" onclick="resetData()">🗑️ مسح تقدّمي من هذا الجهاز</button><button class="go" onclick="back()">رجوع</button>`);
